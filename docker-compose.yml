version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./english_app.db}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - DEBUG=${DEBUG:-false}
    volumes:
      - app-data:/app/data


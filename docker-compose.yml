version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./english_app.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-ant-your-key-here}
    volumes:
      - app-data:/app/data

